<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bearded Dragon Feeder</title>
    <meta name="description" content="Bearded dragon nutrition guide, meal planner, and suggestions" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0b1020;
        --panel: #11162b;
        --muted: #8a93a6;
        --text: #e6ebff;
        --brand: #6ea8fe;
        --brand-2: #b48bff;
        --danger: #ff6b6b;
        --warning: #ffd166;
        --success: #4cc9a6;
        --border: #1b2342;
      }
      * { box-sizing: border-box }
      html, body { height: 100% }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1200px 600px at 80% -200px, rgba(110,168,254,0.12), transparent),
                    radial-gradient(900px 500px at -100px 20%, rgba(180,139,255,0.10), transparent),
                    var(--bg);
        color: var(--text);
      }
      .container { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px }
      .logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: grid; place-items: center; font-weight: 800; color: #0a0f1e }
      h1 { font-size: 22px; margin: 0 }
      .muted { color: var(--muted); font-size: 14px }

      .nav {
        display: flex; gap: 8px; margin: 16px 0 10px;
        background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 6px; border-radius: 12px; width: fit-content;
      }
      .tab-btn {
        appearance: none; background: transparent; color: var(--text); border: 1px solid transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;
      }
      .tab-btn[aria-selected="true"] { background: var(--panel); border-color: var(--border) }

      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 16px }
      .control {
        background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      }
      .control label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em }
      .select, .input { width: 100%; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px }

      .panel { background: rgba(17,22,43,0.85); border: 1px solid var(--border); border-radius: 16px; overflow: hidden }
      .list-head, .row { display: grid; grid-template-columns: 2fr 120px 160px 1fr 40px; gap: 12px }
      .list-head { padding: 12px 14px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em }
      .row { padding: 12px 14px; align-items: center; border-top: 1px solid rgba(255,255,255,0.03) }
      .row:first-child { border-top: none }

      .btn-icon { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); display: grid; place-items: center; color: var(--text); cursor: pointer }
      .btn-icon:hover { background: rgba(255,255,255,0.06) }

      .pill { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-block }
      .pill.staple { background: rgba(76,201,166,0.15); color: var(--success); border: 1px solid rgba(76,201,166,0.25) }
      .pill.occasional { background: rgba(255,209,102,0.12); color: var(--warning); border: 1px solid rgba(255,209,102,0.22) }
      .pill.treat { background: rgba(180,139,255,0.12); color: var(--brand-2); border: 1px solid rgba(180,139,255,0.22) }
      .pill.avoid { background: rgba(255,107,107,0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.22) }

      .footer { margin-top: 16px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; align-items: center }

      /* Planner */
      .planner-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px }
      .day {
        background: rgba(17,22,43,0.85); border: 1px solid var(--border); border-radius: 12px; padding: 10px;
      }
      .day h3 { margin: 0 0 8px; font-size: 14px }
      .tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); font-size: 12px; margin: 4px 6px 4px 0 }
      .tag .remove { background: transparent; border: none; color: var(--muted); cursor: pointer }

      /* Modal */
      .modal-backdrop { position: fixed; inset: 0; background: rgba(6,10,22,0.6); display: none; align-items: center; justify-content: center; padding: 20px }
      .modal { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px }
      .modal header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px }
      .modal h2 { margin: 0; font-size: 18px }
      .modal .close { border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text); border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer }
      .modal .content { color: var(--muted); font-size: 14px }

      @media (max-width: 800px) {
        .list-head, .row { grid-template-columns: 1.4fr 90px 120px 1fr 40px }
        .controls { grid-template-columns: 1fr }
        .planner-grid { grid-template-columns: 1fr 1fr }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">BD</div>
        <div>
          <h1>Bearded Dragon Feeder</h1>
          <div class="muted">Search foods, get age-based suggestions, and plan weekly meals</div>
        </div>
      </header>

      <nav class="nav" role="tablist" aria-label="Main tabs">
        <button class="tab-btn" role="tab" aria-selected="true" aria-controls="tab-search" id="tab-btn-search">Search</button>
        <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-planner" id="tab-btn-planner">Planner</button>
      </nav>

      <section id="tab-search" role="tabpanel" aria-labelledby="tab-btn-search">
        <div class="controls">
          <div class="control">
            <label for="age">Beardie age</label>
            <select id="age" class="select">
              <option value="juvenile">Juvenile (0–6 mo)</option>
              <option value="subadult">Subadult (6–12 mo)</option>
              <option value="adult" selected>Adult (12+ mo)</option>
            </select>
          </div>
          <div class="control">
            <label for="search">Search foods</label>
            <input id="search" class="input" type="text" placeholder="e.g., collard, dubia, berry" />
          </div>
        </div>

        <div class="controls">
          <div class="control">
            <label for="filterType">Filter by type</label>
            <select id="filterType" class="select">
              <option value="all">All types</option>
              <option value="greens">Greens</option>
              <option value="vegetable">Vegetables</option>
              <option value="fruit">Fruits</option>
              <option value="insect">Insects</option>
              <option value="herb">Herbs/Flowers</option>
            </select>
          </div>
          <div class="control">
            <label for="sort">Sort</label>
            <select id="sort" class="select">
              <option value="name">Name</option>
              <option value="guidance">Guidance</option>
              <option value="type">Type</option>
            </select>
          </div>
        </div>

        <div class="panel" role="table" aria-label="Food list">
          <div class="list-head" role="row">
            <div role="columnheader">Food</div>
            <div role="columnheader">Type</div>
            <div role="columnheader">Guidance</div>
            <div role="columnheader">Notes</div>
            <div role="columnheader" aria-label="Actions"></div>
          </div>
          <div id="list" role="rowgroup"></div>
        </div>
        <div class="footer">
          <div id="resultsCount">0 items</div>
          <div class="muted">Tip: Press / to focus search</div>
        </div>
      </section>

      <section id="tab-planner" role="tabpanel" aria-labelledby="tab-btn-planner" hidden>
        <div class="controls">
          <div class="control">
            <label for="plannerAge">Beardie age for planner</label>
            <select id="plannerAge" class="select">
              <option value="juvenile">Juvenile (0–6 mo)</option>
              <option value="subadult">Subadult (6–12 mo)</option>
              <option value="adult" selected>Adult (12+ mo)</option>
            </select>
          </div>
          <div class="control">
            <label>Macros guidance</label>
            <div class="muted" id="macroText">Adults: ~70–80% greens/veg, 20–30% insects; treats rarely</div>
          </div>
        </div>

        <div class="planner-grid" id="planner"></div>

        <div class="footer">
          <button id="clearPlanner" class="btn-icon" title="Clear planner" aria-label="Clear planner">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7h16M9 7v-.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V7m1 0v12.5A1.5 1.5 0 0 1 14.5 21h-5A1.5 1.5 0 0 1 8 19.5V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <div class="muted">Planner saves automatically</div>
        </div>
      </section>
    </div>

    <!-- Modal -->
    <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal">
        <header>
          <h2 id="modalTitle">Food details</h2>
          <button class="close" id="modalClose" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="content" id="modalContent"></div>
      </div>
    </div>

    <script>
      // Data
      const foods = [
        { name: 'Collard Greens', type: 'greens', guidance: 'staple', caP: '2.0:1', notes: 'High calcium, low oxalates', details: 'Rich in calcium, vitamins A, C, K. Excellent staple green.' },
        { name: 'Mustard Greens', type: 'greens', guidance: 'staple', caP: '2.4:1', notes: 'Peppery; mix with other greens', details: 'High calcium; rotate with other staples.' },
        { name: 'Turnip Greens', type: 'greens', guidance: 'staple', caP: '4.5:1', notes: 'Great Ca:P; rotate', details: 'Great Ca:P ratio; low oxalates.' },
        { name: 'Dandelion Greens', type: 'greens', guidance: 'staple', caP: '2.8:1', notes: 'Also flowers are safe', details: 'Leaves and flowers are nutritious; avoid pesticide areas.' },
        { name: 'Endive/Escarole', type: 'greens', guidance: 'staple', caP: '1.9:1', notes: 'Good moisture, low oxalates', details: 'Good hydration and fiber.' },
        { name: 'Arugula (Rocket)', type: 'greens', guidance: 'occasional', caP: '3.2:1', notes: 'Slightly goitrogenic; rotate', details: 'Peppery; rotate to avoid thyroid impacts.' },
        { name: 'Kale', type: 'greens', guidance: 'occasional', caP: '2.4:1', notes: 'Goitrogens/oxalates; moderate', details: 'Use in moderation due to goitrogens.' },
        { name: 'Spinach', type: 'greens', guidance: 'avoid', caP: '2.3:1', notes: 'High oxalates bind calcium', details: 'Avoid; binds calcium strongly.' },
        { name: 'Romaine Lettuce', type: 'greens', guidance: 'occasional', caP: '0.6:1', notes: 'Low nutrients; better options exist', details: 'Mostly water; minimal nutrients.' },
        { name: 'Iceberg Lettuce', type: 'greens', guidance: 'avoid', caP: '0.2:1', notes: 'Very low nutrition; can cause diarrhea', details: 'Avoid; very poor nutrition.' },

        { name: 'Butternut Squash', type: 'vegetable', guidance: 'staple', caP: '1.6:1', notes: 'Grate finely', details: 'Great staple veg; high in beta-carotene.' },
        { name: 'Acorn Squash', type: 'vegetable', guidance: 'staple', caP: '1.1:1', notes: 'Good variety', details: 'Rotate in staple veg mix.' },
        { name: 'Yellow Squash', type: 'vegetable', guidance: 'staple', caP: '1.1:1', notes: 'Hydrating', details: 'Adds moisture to salad.' },
        { name: 'Zucchini', type: 'vegetable', guidance: 'occasional', caP: '0.7:1', notes: 'Lower Ca; mix with greens', details: 'Use with higher-calcium items.' },
        { name: 'Bell Pepper (Red/Green)', type: 'vegetable', guidance: 'occasional', caP: '0.5:1', notes: 'High vit C; moderate', details: 'Chop small; remove seeds.' },
        { name: 'Carrot', type: 'vegetable', guidance: 'occasional', caP: '0.6:1', notes: 'High vit A; limit to avoid hypervitaminosis', details: 'Use sparingly due to vitamin A.' },
        { name: 'Green Beans', type: 'vegetable', guidance: 'occasional', caP: '0.8:1', notes: 'Chop small', details: 'Good fiber; moderate use.' },
        { name: 'Sweet Potato', type: 'vegetable', guidance: 'occasional', caP: '0.7:1', notes: 'Cooked/soft; beta-carotene', details: 'Cook and mash for easier digestion.' },

        { name: 'Blueberries', type: 'fruit', guidance: 'treat', caP: '0.5:1', notes: 'Occasional; wash well', details: 'High sugar; rare treats.' },
        { name: 'Strawberries', type: 'fruit', guidance: 'treat', caP: '0.7:1', notes: 'Small amounts only', details: 'Remove tops; rare.' },
        { name: 'Mango', type: 'fruit', guidance: 'treat', caP: '0.7:1', notes: 'High sugar', details: 'Small diced pieces as treat.' },
        { name: 'Apple (peeled)', type: 'fruit', guidance: 'treat', caP: '0.6:1', notes: 'No seeds; small pieces', details: 'Peel; remove seeds; dice small.' },
        { name: 'Watermelon', type: 'fruit', guidance: 'treat', caP: '0.6:1', notes: 'Mostly water; rare treat', details: 'Hydrating but sugary; rare.' },

        { name: 'Dubia Roaches', type: 'insect', guidance: 'staple', caP: '1.6:1', notes: 'Excellent staple insect', details: 'Gut-load and dust appropriately.' },
        { name: 'Black Soldier Fly Larvae', type: 'insect', guidance: 'staple', caP: '2.5:1', notes: 'Naturally high calcium', details: 'Good calcium; can be wriggly.' },
        { name: 'Crickets', type: 'insect', guidance: 'occasional', caP: '0.3:1', notes: 'Gut-load; can carry parasites', details: 'Escape risk; gut-load well.' },
        { name: 'Hornworms', type: 'insect', guidance: 'treat', caP: '0.5:1', notes: 'Hydrating; good appetite booster', details: 'Very hydrating; great for hydration.' },
        { name: 'Superworms', type: 'insect', guidance: 'occasional', caP: '0.1:1', notes: 'High fat; adults only', details: 'Avoid for juveniles; high fat.' },
        { name: 'Mealworms', type: 'insect', guidance: 'occasional', caP: '0.1:1', notes: 'Hard chitin; avoid for juveniles', details: 'Harder to digest; limit.' },
        { name: 'Waxworms', type: 'insect', guidance: 'treat', caP: '0.1:1', notes: 'Very high fat', details: 'High fat; use as appetite booster only.' },

        { name: 'Cilantro (Coriander)', type: 'herb', guidance: 'occasional', caP: '1.4:1', notes: 'Aromatic; rotate', details: 'Use as garnish; rotate.' },
        { name: 'Basil', type: 'herb', guidance: 'occasional', caP: '1.6:1', notes: 'Strong flavor; small amounts', details: 'Herb; use sparingly.' },
        { name: 'Dandelion Flowers', type: 'herb', guidance: 'staple', caP: '2.8:1', notes: 'Great enrichment', details: 'Pick from pesticide-free areas.' },
      ];

      // Age-based macros guidance
      const ageToMacros = {
        juvenile: { greensVeg: '30–40%', insects: '60–70%', treats: 'rarely', text: 'Juveniles: ~30–40% greens/veg, 60–70% insects; treats rarely' },
        subadult: { greensVeg: '50–60%', insects: '40–50%', treats: 'rarely', text: 'Subadults: ~50–60% greens/veg, 40–50% insects; treats rarely' },
        adult: { greensVeg: '70–80%', insects: '20–30%', treats: 'rarely', text: 'Adults: ~70–80% greens/veg, 20–30% insects; treats rarely' },
      };

      // Elements
      const tabBtnSearch = document.getElementById('tab-btn-search');
      const tabBtnPlanner = document.getElementById('tab-btn-planner');
      const tabSearch = document.getElementById('tab-search');
      const tabPlanner = document.getElementById('tab-planner');

      const ageSelect = document.getElementById('age');
      const plannerAgeSelect = document.getElementById('plannerAge');
      const searchInput = document.getElementById('search');
      const filterType = document.getElementById('filterType');
      const sortSelect = document.getElementById('sort');
      const list = document.getElementById('list');
      const resultsCount = document.getElementById('resultsCount');

      const plannerGrid = document.getElementById('planner');
      const macroText = document.getElementById('macroText');
      const clearPlannerBtn = document.getElementById('clearPlanner');

      const modalBackdrop = document.getElementById('modalBackdrop');
      const modalTitle = document.getElementById('modalTitle');
      const modalContent = document.getElementById('modalContent');
      const modalClose = document.getElementById('modalClose');

      // Helpers
      const formatType = (t) => ({ greens: 'Greens', vegetable: 'Vegetable', fruit: 'Fruit', insect: 'Insect', herb: 'Herb/Flower' })[t] || t;
      const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);
      function normalize(text) { return text.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, ''); }

      function createRow(food) {
        const row = document.createElement('div');
        row.className = 'row';
        row.setAttribute('role', 'row');

        const name = document.createElement('div');
        const sub = `<div class="muted" style="font-size:12px">Ca:P ${food.caP}</div>`;
        name.innerHTML = `<div style="font-weight:600">${food.name}</div>${sub}`;

        const type = document.createElement('div');
        type.textContent = formatType(food.type);
        type.className = 'muted';

        const guidance = document.createElement('div');
        const p = document.createElement('span');
        p.className = `pill ${food.guidance}`;
        p.textContent = capitalize(food.guidance);
        guidance.appendChild(p);

        const notes = document.createElement('div');
        notes.textContent = food.notes;
        notes.className = 'muted';

        const actions = document.createElement('div');
        const infoBtn = document.createElement('button');
        infoBtn.className = 'btn-icon';
        infoBtn.title = 'View details';
        infoBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 8.5v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 11.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
        infoBtn.addEventListener('click', () => openDetails(food));
        actions.appendChild(infoBtn);

        row.appendChild(name);
        row.appendChild(type);
        row.appendChild(guidance);
        row.appendChild(notes);
        row.appendChild(actions);
        return row;
      }

      function openDetails(food) {
        modalTitle.textContent = food.name;
        modalContent.innerHTML = `
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px">
            <div><div class="muted">Type</div><div>${formatType(food.type)}</div></div>
            <div><div class="muted">Guidance</div><div><span class="pill ${food.guidance}">${capitalize(food.guidance)}</span></div></div>
            <div><div class="muted">Ca:P</div><div>${food.caP}</div></div>
          </div>
          <div>${food.details}</div>
        `;
        modalBackdrop.style.display = 'flex';
        modalBackdrop.setAttribute('aria-hidden', 'false');
      }

      function closeModal() {
        modalBackdrop.style.display = 'none';
        modalBackdrop.setAttribute('aria-hidden', 'true');
      }

      modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });
      modalClose.addEventListener('click', closeModal);
      window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      function sortFoods(list, key) {
        const copy = [...list];
        if (key === 'name') copy.sort((a, b) => a.name.localeCompare(b.name));
        if (key === 'type') copy.sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
        if (key === 'guidance') copy.sort((a, b) => guidanceRank(a.guidance) - guidanceRank(b.guidance) || a.name.localeCompare(b.name));
        return copy;
      }

      function guidanceRank(g) {
        return { staple: 0, occasional: 1, treat: 2, avoid: 3 }[g] ?? 99;
      }

      function renderList() {
        const q = normalize(searchInput.value.trim());
        const ft = filterType.value;
        const sortKey = sortSelect.value;
        const filtered = foods.filter(f => {
          const matchesType = ft === 'all' || f.type === ft;
          const matchesText = !q || normalize(f.name).includes(q) || normalize(f.notes).includes(q);
          // age-based nudge: deemphasize avoid for all; for juveniles, deemphasize hard-chitin insects
          if (ageSelect.value === 'juvenile' && (f.name.includes('Superworm') || f.name.includes('Mealworm'))) return matchesType && matchesText; // still show
          return matchesType && matchesText;
        });
        const sorted = sortFoods(filtered, sortKey);

        list.innerHTML = '';
        for (const item of sorted) list.appendChild(createRow(item));
        resultsCount.textContent = `${sorted.length} item${sorted.length === 1 ? '' : 's'}`;
      }

      // Planner state
      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      let planner = loadPlanner();

      function loadPlanner() {
        try { return JSON.parse(localStorage.getItem('planner') || 'null') || days.map(() => ({ greensVeg: [], insects: [], treats: [] })); }
        catch { return days.map(() => ({ greensVeg: [], insects: [], treats: [] })); }
      }
      function savePlanner() { localStorage.setItem('planner', JSON.stringify(planner)); }

      function renderPlanner() {
        const age = plannerAgeSelect.value;
        macroText.textContent = ageToMacros[age].text;
        plannerGrid.innerHTML = '';
        days.forEach((day, idx) => {
          const section = document.createElement('div');
          section.className = 'day';
          const h = document.createElement('h3');
          h.textContent = day;
          section.appendChild(h);

          section.appendChild(renderCategory(idx, 'greensVeg', 'Greens/Veg'));
          section.appendChild(renderCategory(idx, 'insects', 'Insects'));
          section.appendChild(renderCategory(idx, 'treats', 'Treats'));

          const addRow = document.createElement('div');
          addRow.style.marginTop = '8px';
          const addSelect = document.createElement('select');
          addSelect.className = 'select';
          const placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Add food…';
          addSelect.appendChild(placeholder);
          // options filtered by category guidance
          foods.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.name;
            opt.textContent = `${f.name} (${formatType(f.type)})`;
            addSelect.appendChild(opt);
          });
          const addBtn = document.createElement('button');
          addBtn.className = 'btn-icon';
          addBtn.style.marginLeft = '8px';
          addBtn.title = 'Add to day';
          addBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
          const addWrap = document.createElement('div');
          addWrap.style.display = 'flex';
          addWrap.style.alignItems = 'center';
          addWrap.appendChild(addSelect);
          addWrap.appendChild(addBtn);

          addBtn.addEventListener('click', () => {
            const chosen = foods.find(x => x.name === addSelect.value);
            if (!chosen) return;
            const category = suggestCategory(chosen, age);
            planner[idx][category].push(chosen.name);
            savePlanner();
            renderPlanner();
            addSelect.value = '';
          });

          section.appendChild(addWrap);
          plannerGrid.appendChild(section);
        });
      }

      function renderCategory(dayIdx, key, label) {
        const wrap = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'muted';
        const age = plannerAgeSelect.value;
        const macros = ageToMacros[age];
        const target = key === 'greensVeg' ? macros.greensVeg : key === 'insects' ? macros.insects : macros.treats;
        title.textContent = `${label} (target ${target})`;
        wrap.appendChild(title);
        const items = document.createElement('div');
        planner[dayIdx][key].forEach((name, i) => {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = name;
          const remove = document.createElement('button');
          remove.className = 'remove';
          remove.innerHTML = '&times;';
          remove.setAttribute('aria-label', `Remove ${name}`);
          remove.addEventListener('click', () => { planner[dayIdx][key].splice(i,1); savePlanner(); renderPlanner(); });
          tag.appendChild(remove);
          items.appendChild(tag);
        });
        wrap.appendChild(items);
        return wrap;
      }

      function suggestCategory(food, age) {
        if (food.guidance === 'treat' || food.type === 'fruit') return 'treats';
        if (food.type === 'insect') return age === 'adult' ? 'insects' : 'insects';
        return 'greensVeg';
      }

      // Events
      ageSelect.addEventListener('change', () => { localStorage.setItem('age', ageSelect.value); renderList(); });
      plannerAgeSelect.addEventListener('change', () => { localStorage.setItem('plannerAge', plannerAgeSelect.value); renderPlanner(); });

      searchInput.addEventListener('input', renderList);
      filterType.addEventListener('change', renderList);
      sortSelect.addEventListener('change', renderList);

      clearPlannerBtn.addEventListener('click', () => { if (confirm('Clear planner for all days?')) { planner = days.map(() => ({ greensVeg: [], insects: [], treats: [] })); savePlanner(); renderPlanner(); } });

      // Tab behavior
      function selectTab(which) {
        const isSearch = which === 'search';
        tabBtnSearch.setAttribute('aria-selected', String(isSearch));
        tabBtnPlanner.setAttribute('aria-selected', String(!isSearch));
        tabSearch.hidden = !isSearch;
        tabPlanner.hidden = isSearch;
      }
      tabBtnSearch.addEventListener('click', () => selectTab('search'));
      tabBtnPlanner.addEventListener('click', () => selectTab('planner'));

      // Init
      (function init() {
        const savedAge = localStorage.getItem('age');
        const savedPlannerAge = localStorage.getItem('plannerAge');
        if (savedAge) ageSelect.value = savedAge;
        if (savedPlannerAge) plannerAgeSelect.value = savedPlannerAge;
        macroText.textContent = ageToMacros[plannerAgeSelect.value].text;
        renderList();
        renderPlanner();
      })();

      // Keyboard: focus search
      window.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput && !modalBackdrop.style.display) {
          e.preventDefault();
          selectTab('search');
          searchInput.focus();
          searchInput.select();
        }
      });
    </script>
  </body>
</html>
